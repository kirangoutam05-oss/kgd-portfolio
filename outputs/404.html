<script>
(function(){
  try{
    var saved = localStorage.getItem('kgd-theme');
    var t = saved || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    document.documentElement.setAttribute('data-theme', t);
  }catch(e){
    document.documentElement.setAttribute('data-theme','light');
  }
})();
</script>

  /* ---------- theme ----------
   Tokens flip on :root[data-theme]. The attribute is set before first
   paint by the inline script in <head>, from a stored choice or the OS
   preference, so there is no flash of the wrong theme. */

<script>
(function(){
  var btn = document.getElementById('theme-toggle');
  if (!btn) return;
  var root = document.documentElement;
  function sync(){
    var dark = root.getAttribute('data-theme') === 'dark';
    btn.setAttribute('aria-pressed', dark ? 'true' : 'false');
    btn.setAttribute('aria-label', dark ? 'Switch to light theme' : 'Switch to dark theme');
  }
  btn.addEventListener('click', function(){
    var next = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
    root.setAttribute('data-theme', next);
    try{ localStorage.setItem('kgd-theme', next); }catch(e){}
    sync();
  });
  sync();
})();
</script>
